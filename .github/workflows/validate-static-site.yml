name: Validate static site

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check vendor/supabase-js-2.117.3.js
          node --input-type=module --check < app.js
      - name: Validate HTML pages and local links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path(".").resolve()
          pages = sorted(root.rglob("*.html"))
          if not pages:
              raise SystemExit("No HTML pages found")

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = set()
                  self.refs = []
                  self.lang = None
                  self.title_seen = False
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "html":
                      self.lang = attrs.get("lang")
                  if tag == "title":
                      self.in_title = True
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  for attr in ("href", "src", "action"):
                      if attrs.get(attr):
                          self.refs.append(attrs[attr])

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title and data.strip():
                      self.title_seen = True

          parsed = {}
          for page in pages:
              parser = PageParser()
              parser.feed(page.read_text(encoding="utf-8"))
              parser.close()
              if not parser.lang:
                  raise SystemExit(f"{page.relative_to(root)}: missing html lang")
              if not parser.title_seen:
                  raise SystemExit(f"{page.relative_to(root)}: missing title")
              parsed[page.resolve()] = parser

          external = ("http", "https", "mailto", "tel", "data", "javascript")
          errors = []
          for page, parser in parsed.items():
              for ref in parser.refs:
                  url = urlsplit(ref)
                  if url.scheme.lower() in external or ref.startswith("//"):
                      continue
                  path = unquote(url.path)
                  target = (page.parent / path).resolve() if path else page
                  if path.startswith("/"):
                      target = (root / path.lstrip("/")).resolve()
                  if target.is_dir():
                      target = target / "index.html"
                  if not target.exists():
                      errors.append(f"{page.relative_to(root)}: missing target {ref}")
                      continue
                  if url.fragment:
                      target_parser = parsed.get(target)
                      if target_parser and unquote(url.fragment) not in target_parser.ids:
                          errors.append(f"{page.relative_to(root)}: missing anchor {ref}")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(pages)} HTML pages and local links.")
          PY
